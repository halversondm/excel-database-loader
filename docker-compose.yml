services:
  postgres:
    image: 'bitnami/postgresql:15'
    networks:
      - app-tier
    ports:
      - "5433:5432"
    volumes:
      - "postgres_data:/bitnami/postgresql"
    environment:
      - POSTGRESQL_USERNAME=devuser
      - POSTGRESQL_PASSWORD=example
      - POSTGRESQL_DATABASE=devuser
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
  excel-database-loader-api:
    image: halversondm/excel-database-loader-api:latest
    networks:
      - app-tier
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/devuser
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
  excel-database-loader-ui:
    image: halversondm/excel-database-loader-ui:latest
    networks:
      - app-tier
    ports:
      - "9200:8080"
    depends_on:
      - postgres
      - excel-database-loader-api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
networks:
  app-tier:
    driver: bridge
volumes:
  postgres_data: {}